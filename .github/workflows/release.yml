name: Build SiKasirSahaja Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK Release
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release && exit 0
            echo "Build gagal (kemungkinan timeout download Gradle), retry $i/5..."
            sleep 15
          done
          exit 1

      - name: Copy Renamed APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SiKasirSahaja-Android.apk

      - name: Upload SiKasirSahaja Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiKasirSahaja-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SiKasirSahaja - Latest Release"
          body: |
            Build otomatis terbaru dari branch `${{ github.ref_name }}`.
            Tanggal build: ${{ github.event.head_commit.timestamp || 'N/A' }}
            Commit: ${{ github.sha }}
          files: SiKasirSahaja-Android.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
