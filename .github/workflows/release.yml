name: Build & Release APK

on:
  # 1. Memicu workflow saat push Git Tag (contoh: git tag v1.0.0 && git push origin v1.0.0)
  push:
    tags:
      - 'v*'

  # 2. Memicu workflow manual dari tab Actions di GitHub UI
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag versi release (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Judul Release'
        required: false
        default: 'SiKasirSahaja Release'
      release_notes:
        description: 'Catatan Rilis / Changelog ringkas'
        required: false
        default: 'Pembaruan aplikasi kasir SiKasirSahaja.'

# Berikan izin tulis ke GitHub Releases
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: windows-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Java Development Kit (JDK 17)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 3: Setup Flutter SDK
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Verifikasi instalasi Flutter & dependensi
      - name: Flutter Doctor & Get Packages
        run: |
          flutter doctor -v
          flutter pub get

      # Step 5: Build APK Release (Windows runner)
      - name: Build Flutter APK
        run: |
          flutter build apk --release

      # Step 6: Tentukan Tag Versi & Judul Release
      - name: Determine Version Tag & Release Title
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
            TITLE="${{ github.event.inputs.release_title }} ($TAG_NAME)"
            BODY="${{ github.event.inputs.release_notes }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TITLE="SiKasirSahaja $TAG_NAME"
            BODY="Rilis otomatis SiKasirSahaja untuk versi $TAG_NAME."
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "body=$BODY" >> $GITHUB_OUTPUT

      # Step 7: Verifikasi Keberadaan File APK sebelum Release
      - name: Verify APK Exists
        shell: pwsh
        run: |
          $apkPath = "build\app\outputs\flutter-apk\app-release.apk"
          if (-Not (Test-Path $apkPath)) {
            Write-Error "File APK tidak ditemukan pada: $apkPath. Membatalkan release."
            exit 1
          }
          $item = Get-Item $apkPath
          Write-Host "File APK terverifikasi ($($item.Length) bytes): $apkPath"

      # Step 8: Upload File APK ke GitHub Releases (hanya jika build berhasil)
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body: |
            ${{ steps.vars.outputs.body }}

            ---
            ### 📱 Download Langsung APK:
            [Download app-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/app-release.apk)
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

