
name: Build SiKasirSahaja Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v5

      # 2. Setup Java JDK
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Install dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 6. Build APK dengan retry
      - name: Build Android APK Release
        run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release && exit 0
            echo "Build gagal, retry $i/5..."
            sleep 15
          done
          exit 1

      # 7. Rename APK
      - name: Copy Renamed APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
          SiKasirSahaja-Android.apk

      # 8. Upload Artifact
      - name: Upload SiKasirSahaja Android APK
        uses: actions/upload-artifact@v5
        with:
          name: SiKasirSahaja-Android-APK
          path: SiKasirSahaja-Android.apk
          if-no-files-found: error
          retention-days: 30

      # 9. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Si Kasir Sahaja v1.0.${{ github.run_number }}
          target_commitish: main
          body: |
            # Si Kasir Sahaja

            Android APK Release.

            Version: v1.0.${{ github.run_number }}
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Download SiKasirSahaja-Android.apk
          files: SiKasirSahaja-Android.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
